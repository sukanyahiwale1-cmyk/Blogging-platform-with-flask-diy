{% extends "base.html" %}

{% block title %}403 Forbidden | Chronicle{% endblock %}

{% block content %}
<div class="container py-5 my-auto text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="display-1 fw-extrabold text-danger mb-2">403</div>
            <h2 class="fw-bold text-dark mb-3">Access Forbidden</h2>
            <p class="text-secondary mb-4">
                You do not have permission to access or modify this resource. Only the original author can edit or delete their own posts and content.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-house me-1"></i> Return Home
                </a>
                <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-speedometer2 me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
