{% extends "base.html" %}

{% block title %}404 Not Found | Chronicle{% endblock %}

{% block content %}
<div class="container py-5 my-auto text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="display-1 fw-extrabold text-primary mb-2">404</div>
            <h2 class="fw-bold text-dark mb-3">Page Not Found</h2>
            <p class="text-secondary mb-4">
                The article or page you are looking for might have been moved, deleted, or does not exist.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-house me-1"></i> Return Home
                </a>
                <a href="{{ url_for('main.search') }}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-search me-1"></i> Search Stories
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
